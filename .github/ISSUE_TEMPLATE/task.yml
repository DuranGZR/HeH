name: Mühendislik Görevi
description: HEH geliştirme sürecindeki görev veya hata kaydı
title: "[TASK] "
labels: ["task"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Öncelik
      options:
        - P0
        - P1
        - P2
    validations:
      required: true
  - type: input
    id: scope_ref
    attributes:
      label: Kapsam / Referans
      placeholder: "Örn. W1 / D03"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Kabul Kriterleri
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test ve Kanıt
      placeholder: "Çalıştırılan komutlar ve sonuçlar"
